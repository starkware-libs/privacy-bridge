[workspace]
members = ["packages/bridge-anonymizers"]

[workspace.package]
version = "0.1.0"
edition = "2024_07"
license = "Apache-2.0"

[workspace.dependencies]
starknet = "2.19.1"
snforge_std = "0.62.1"
assert_macros = "2.19.1"

# Use the registry-distributed prebuilt snforge plugin binary instead of
# compiling `snforge_scarb_plugin` from source (which fails against the system
# rustc). Mirrors the reference starknet-privacy workspace config.
[workspace.tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]

[scripts]
test = "snforge test"
