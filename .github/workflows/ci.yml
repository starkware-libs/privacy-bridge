name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'PR' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Builds + tests the Cairo anonymizer contracts. Guarded so it is a stable,
  # always-reporting required check: on the near-empty bootstrap `main` there is
  # no Scarb.toml yet, so the guard skips build/test and the job reports green.
  # Once packages/bridge-anonymizers lands, the guard passes and the real
  # `scarb build` + `scarb test` run. (The guard is a harmless no-op thereafter.)
  cairo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Detect Cairo workspace
        id: guard
        run: |
          if [ -f Scarb.toml ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No Scarb.toml at repo root yet — skipping Cairo build/test."
          fi

      - name: Set up Scarb
        if: steps.guard.outputs.run == 'true'
        uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1
        with:
          scarb-version: '2.19.1'

      - name: Set up Starknet Foundry
        if: steps.guard.outputs.run == 'true'
        uses: foundry-rs/setup-snfoundry@ee00ea3f026379008ca40a54448d4059233d06cc # v4
        with:
          starknet-foundry-version: '0.62.1'

      - name: scarb fmt --check
        if: steps.guard.outputs.run == 'true'
        run: scarb fmt --check

      - name: scarb build
        if: steps.guard.outputs.run == 'true'
        run: scarb build

      - name: scarb test
        if: steps.guard.outputs.run == 'true'
        run: scarb test

  # Builds + typechecks + tests the TypeScript workspace (bridge-core + apps/bridge).
  # Guarded like `cairo` so it stays a stable, always-reporting check even on a
  # bootstrap `main` with no pnpm workspace yet. The pool SDK
  # (@starkware-libs/starknet-privacy-sdk) installs from GitHub Packages; the
  # automatic GITHUB_TOKEN (packages: read) authenticates to the public package.
  # If a cross-repo package read is ever rejected, swap in a PAT secret here.
  bridge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Detect JS workspace
        id: guard
        run: |
          if [ -f package.json ] && [ -f pnpm-workspace.yaml ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No pnpm workspace at repo root yet — skipping JS build/test."
          fi

      - name: Set up pnpm
        if: steps.guard.outputs.run == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '9.15.0'

      - name: Set up Node
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # pnpm ignores ${ENV} in credential lines from the committed .npmrc, so the
      # GitHub Packages token must live in a user-level ~/.npmrc it will expand.
      - name: Authenticate to GitHub Packages
        if: steps.guard.outputs.run == 'true'
        run: echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" >> ~/.npmrc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install
        if: steps.guard.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.guard.outputs.run == 'true'
        run: pnpm build

      - name: Typecheck
        if: steps.guard.outputs.run == 'true'
        run: pnpm typecheck

      - name: Test
        if: steps.guard.outputs.run == 'true'
        run: pnpm test
